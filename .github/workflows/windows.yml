name: Windows build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional mocha --grep pattern; empty runs the full suite"
        required: false
        default: ""

jobs:
  build:
    name: Node ${{ matrix.node-version }}
    runs-on: windows-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # mocha nolonger supports node 10
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: |
          npm ci

      - name: Run Tests
        shell: bash
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npx mocha -R spec --no-colors --grep "${{ inputs.test-filter }}"
          else
            npm test -- --no-colors
          fi
